<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pre-Market Dashboard — NIFTY</title>
<style>
  :root {
    --bg: #f6f7fa;
    --surface: #ffffff;
    --surface2: #eef1f6;
    --line: #e4e8ef;
    --text: #1c2330;
    --muted: #6b7686;
    --faint: #9aa4b5;
    --up: #128a4b;
    --down: #c93a3a;
    --amber: #9a6a12;
    --accent: #3f5cff;
    --up-bg: rgba(18,138,75,.09);
    --down-bg: rgba(201,58,58,.09);
    --amber-bg: rgba(154,106,18,.09);
    --accent-bg: rgba(63,92,255,.09);
    --mono: "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
    --shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  html[data-theme="dark"] {
    --bg: #0d131f;
    --surface: #151d2d;
    --surface2: #1e2840;
    --line: #27334d;
    --text: #e7edf8;
    --muted: #8b96ab;
    --faint: #5c6880;
    --up: #3ecf8a;
    --down: #ef6b72;
    --amber: #e0b265;
    --accent: #7b95ff;
    --up-bg: rgba(62,207,138,.12);
    --down-bg: rgba(239,107,114,.12);
    --amber-bg: rgba(224,178,101,.12);
    --accent-bg: rgba(123,149,255,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    transition: background .2s, color .2s;
  }

  header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .hbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; padding: 12px 28px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 16px; font-weight: 650; letter-spacing: .2px; }
  .brand .sub { color: var(--muted); font-size: 11px; }
  .hmeta { display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }

  .pill {
    padding: 3px 11px; border-radius: 999px; font-size: 10px; font-weight: 600;
    letter-spacing: .8px; text-transform: uppercase; font-family: var(--mono);
    border: 1px solid var(--line); color: var(--muted);
  }
  .pill.open  { color: var(--up);   background: var(--up-bg);   border-color: color-mix(in srgb, var(--up) 30%, transparent); }
  .pill.closed{ color: var(--amber); background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 30%, transparent); }
  .pill.err   { color: var(--down); background: var(--down-bg); border-color: color-mix(in srgb, var(--down) 30%, transparent); }

  .meta-sep { width: 1px; height: 14px; background: var(--line); }
  #lastUpdated, #countdown { font-family: var(--mono); font-size: 11px; }
  .buildtag {
    font-family: var(--mono); font-size: 10px; color: var(--faint);
    background: var(--surface2); padding: 2px 8px; border-radius: 999px;
  }

  button.icon {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    width: 30px; height: 30px; cursor: pointer; color: var(--muted);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s;
  }
  button.icon:hover { color: var(--text); border-color: var(--faint); }

  /* pause / live switch */
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .swlabel { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }
  .switch.on .swlabel { color: var(--accent); }
  .swtrack {
    width: 34px; height: 19px; border-radius: 999px; background: var(--surface2);
    border: 1px solid var(--line); position: relative; transition: background .2s;
  }
  .swthumb {
    position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: var(--surface); border: 1px solid var(--line); transition: transform .2s;
  }
  .switch.on .swtrack { background: var(--accent); border-color: var(--accent); }
  .switch.on .swthumb { transform: translateX(15px); border-color: var(--accent); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: none; }
  .switch.on .live-dot { display: block; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  button.refresh {
    background: var(--surface); border: 1px solid var(--line); color: var(--text); cursor: pointer;
    padding: 5px 14px; border-radius: 8px; font-size: 12px; font-weight: 600;
    transition: border-color .15s, color .15s;
  }
  button.refresh:hover { border-color: var(--accent); color: var(--accent); }
  button.refresh:disabled { opacity: .5; cursor: wait; }

  .tape {
    display: flex; gap: 0; overflow-x: auto; white-space: nowrap;
    border-top: 1px solid var(--line);
    font-family: var(--mono);
    background: var(--bg);
    scrollbar-width: none;
  }
  .tape::-webkit-scrollbar { display: none; }
  .tape .tt {
    display: flex; align-items: baseline; gap: 8px;
    padding: 6px 18px; border-right: 1px solid var(--line);
    font-size: 11px;
  }
  .tape .tt .ts { color: var(--muted); font-weight: 600; letter-spacing: .8px; }
  .tape .tt .tv { color: var(--text); font-weight: 600; }
  .tape .tt .tc { font-weight: 600; }

  .tabs {
    display: flex; gap: 2px; padding: 0 28px;
    background: color-mix(in srgb, var(--surface) 85%, transparent);
    border-bottom: 1px solid var(--line);
    position: sticky; top: 63px; z-index: 15;
  }
  .tab {
    padding: 10px 16px; font-size: 13px; font-weight: 500;
    color: var(--muted); cursor: pointer;
    border: 0; border-bottom: 2px solid transparent; background: none;
    display: flex; align-items: center; gap: 7px;
    transition: color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .tab .tcount { font-size: 10px; font-family: var(--mono); background: var(--surface2); padding: 1px 7px; border-radius: 999px; color: var(--muted); }

  main { padding: 22px 28px 60px; max-width: 1180px; margin: 0 auto; }
  .banner {
    padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500;
    margin-bottom: 18px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--line); background: var(--surface);
  }
  .banner .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .banner .bsub { font-weight: 400; color: var(--muted); font-size: 12px; font-family: var(--mono); }
  .banner.closed .dot { background: var(--amber); }
  .banner.premarket .dot { background: var(--accent); }
  .banner.open .dot { background: var(--up); }
  .errbanner {
    background: var(--down-bg); border: 1px solid color-mix(in srgb, var(--down) 30%, transparent);
    color: var(--down); padding: 10px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px;
  }
  .warnbanner {
    background: var(--amber-bg); border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
    color: var(--amber); padding: 10px 16px; border-radius: 10px; font-size: 12px; margin-bottom: 16px;
    font-family: var(--mono); line-height: 1.6;
  }
  .warnbanner .wline { display: block; }

  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .schip {
    font-size: 11px; font-weight: 500; padding: 4px 11px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  }
  .schip.good { color: var(--up); }
  .schip.mid  { color: var(--amber); }
  .schip.bad  { color: var(--down); }

  .section { margin-bottom: 26px; }
  .section h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.6px;
    color: var(--muted); margin-bottom: 12px; font-weight: 600;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .grid.raw { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
    transition: border-color .15s;
    box-shadow: var(--shadow);
  }
  .card:hover { border-color: var(--faint); }
  .ctop { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ctitle { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .7px; }
  .csrc {
    font-size: 9px; color: var(--muted); background: var(--surface2);
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .cval { font-size: 21px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .cval.small { font-size: 16px; }
  .cchg { font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .up   { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }
  .cdetail { font-size: 11px; color: var(--muted); line-height: 1.45; }
  .cupdated { font-size: 10px; color: var(--faint); margin-top: auto; font-family: var(--mono); }

  .trend.bullish { color: var(--up); }
  .trend.bearish { color: var(--down); }
  .trend.sideways{ color: var(--amber); }

  /* analysis cards — badge verdict, spacious, equation-style reasoning */
  .grid.checks { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .check {
    gap: 12px; padding: 22px 24px; min-height: 190px; justify-content: space-between;
  }
  .check .ctitle { font-size: 11px; }
  .cverdict {
    font-size: 14px; font-weight: 700; line-height: 1;
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 13px; border-radius: 999px; width: fit-content;
    border: 1px solid transparent;
  }
  .cverdict .vdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .cverdict.up   { color: var(--up);   background: var(--up-bg);   border-color: color-mix(in srgb, var(--up) 25%, transparent); }
  .cverdict.down { color: var(--down); background: var(--down-bg); border-color: color-mix(in srgb, var(--down) 25%, transparent); }
  .cverdict.flat { color: var(--amber); background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 25%, transparent); }
  .cverdict.up .vdot { background: var(--up); }
  .cverdict.down .vdot { background: var(--down); }
  .cverdict.flat .vdot { background: var(--amber); }
  .cvalue { font-size: 15px; font-weight: 600; color: var(--text); font-family: var(--mono); line-height: 1.4; }
  .ceq {
    font-size: 15px; font-weight: 600; color: var(--text); font-family: var(--mono);
    background: var(--surface2); border-radius: 8px; padding: 8px 12px; width: fit-content;
  }
  .crule { font-size: 10.5px; color: var(--faint); font-family: var(--mono); letter-spacing: .2px; }

  .wide-ladder-card { margin-bottom: 16px; padding: 20px 26px 22px; }
  .hladder { margin-top: 18px; }
  .hladder-track {
    position: relative; height: 6px; border-radius: 999px; margin: 0 8px;
    background: linear-gradient(90deg, var(--up) 0%, var(--faint) 50%, var(--down) 100%);
    opacity: .55;
  }
  .hladder-marker {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
  }
  .hm-dot {
    display: block; width: 14px; height: 14px; border-radius: 50%;
    border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line);
  }
  .hladder-marker.sup .hm-dot { background: var(--up); }
  .hladder-marker.res .hm-dot { background: var(--down); }
  .hladder-marker.cls .hm-dot { background: var(--text); width: 16px; height: 16px; }
  .hladder-labels { display: flex; justify-content: space-between; margin-top: 22px; }
  .hl-item { display: flex; flex-direction: column; gap: 3px; }
  .hl-item.cls { align-items: center; text-align: center; }
  .hl-item.res { align-items: flex-end; text-align: right; }
  .hl-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); font-weight: 600;
  }
  .hl-val { font-size: 22px; font-weight: 700; font-family: var(--mono); color: var(--text); }
  .hl-item.sup .hl-val { color: var(--up); }
  .hl-item.res .hl-val { color: var(--down); }
  .hl-sub { font-size: 10.5px; color: var(--faint); font-family: var(--mono); }
  .hladder-track { overflow: visible; }
  .hladder-marker.cur .hm-dot {
    background: var(--accent); width: 12px; height: 12px;
    box-shadow: 0 0 0 1px var(--line), 0 0 8px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .hladder-current {
    display: flex; align-items: baseline; gap: 14px; margin-top: 16px;
    padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  .hc-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; }
  .hc-val { font-size: 18px; font-weight: 700; font-family: var(--mono); color: var(--accent); }
  .hc-dist { font-size: 11.5px; font-family: var(--mono); }
  .hc-dist.up { color: var(--up); }
  .hc-dist.down { color: var(--down); font-weight: 600; }
  .hc-dist.breakout { color: var(--accent); font-weight: 600; }
  .hc-dist.muted { color: var(--muted); }

  .chart-toolbar { display: flex; gap: 8px; margin: 16px 0 10px; }
  .tf-btn {
    font-size: 11px; font-weight: 600; padding: 6px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer;
  }
  .tf-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
  #trendChart {
    width: 100%; display: block; border: 1px solid var(--line); border-radius: 12px;
    background: var(--surface); box-shadow: var(--shadow);
  }
  .trend-status .trend-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-top: 14px;
  }
  .trend-status .tg-label {
    display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--faint); font-weight: 700; margin-bottom: 3px;
  }
  .trend-status .tg-val { font-size: 14px; font-weight: 600; font-family: var(--mono); color: var(--text); }
  .trend-status .tg-val.up { color: var(--up); }
  .trend-status .tg-val.down { color: var(--down); }
  .trend-candle-status {
    font-size: 11px; color: var(--muted); font-family: var(--mono);
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
  }
  .forming-tag {
    font-size: 9px; font-weight: 700; letter-spacing: .5px; color: var(--amber);
    background: var(--amber-bg); padding: 2px 6px; border-radius: 999px; margin-left: 4px;
  }
  .trend-stale .bias-verdict { color: var(--down); }

  .oc-header {
    display: flex; flex-wrap: wrap; gap: 22px; padding: 16px 20px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .oc-hitem { display: flex; flex-direction: column; gap: 4px; }
  .oc-table-wrap { overflow-x: auto; margin-bottom: 16px; }
  .oc-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; background: var(--surface); border-radius: 12px; overflow: hidden; }
  .oc-table th, .oc-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); }
  .oc-table thead th { font-size: 9px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); font-weight: 700; }
  .oc-side-label { text-align: center !important; font-size: 11px !important; letter-spacing: 1px; }
  .oc-side-label.ce { color: var(--up); }
  .oc-side-label.pe { color: var(--down); }
  .oc-strike { text-align: center; font-weight: 700; background: var(--surface2); }
  .oc-atm .oc-strike { color: var(--accent); background: var(--accent-bg); }
  .oc-atm td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .oc-ltp { font-weight: 700; color: var(--text); }
  .oc-empty { text-align: center; color: var(--faint); }
  .oc-num.up { color: var(--up); } .oc-num.down { color: var(--down); } .oc-num.flat { color: var(--muted); }

  .oc-strike-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .oc-side-block { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .oc-side-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 10px; }
  .oc-side-block.ce .oc-side-title { color: var(--up); }
  .oc-side-block.pe .oc-side-title { color: var(--down); }
  .oc-sum-line { display: flex; justify-content: space-between; padding: 4px 0; }

  .oc-levels { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .oc-levels-title { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--faint); font-weight: 700; margin-bottom: 10px; }
  .oc-level-group { margin-bottom: 10px; }
  .oc-level-label { display: block; font-size: 10.5px; font-weight: 600; margin-bottom: 6px; }
  .oc-level-label.up { color: var(--up); } .oc-level-label.down { color: var(--down); }
  .oc-level-row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; font-family: var(--mono); font-size: 11px; }
  .oc-level-strike { width: 70px; flex: none; }
  .oc-level-bar-track { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .oc-level-bar { height: 100%; border-radius: 4px; }
  .oc-level-bar.up { background: var(--up); } .oc-level-bar.down { background: var(--down); }
  .oc-level-oi { width: 60px; text-align: right; color: var(--muted); flex: none; }

  .news-grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; margin-top: 16px; }
  .news-card { gap: 8px; }
  .news-impact {
    font-size: 10px; text-transform: uppercase; letter-spacing: .6px; font-weight: 700;
    padding: 3px 9px; border-radius: 999px; border: 1px solid transparent;
  }
  .news-impact.up   { color: var(--muted); background: var(--surface2); }
  .news-impact.flat { color: var(--amber); background: var(--amber-bg); border-color: color-mix(in srgb, var(--amber) 25%, transparent); }
  .news-impact.down { color: var(--down);  background: var(--down-bg);  border-color: color-mix(in srgb, var(--down) 25%, transparent); }
  .news-headline { font-size: 13.5px; line-height: 1.45; color: var(--text); font-weight: 500; text-decoration: none; }
  .news-headline:hover { text-decoration: underline; }
  .news-foot { margin-top: auto; padding-top: 6px; }
  .bias {
    border-radius: 14px; padding: 16px 18px; margin-bottom: 16px;
    border: 1px solid var(--line); background: var(--surface);
  }
  .bias.up   { border-color: color-mix(in srgb, var(--up) 30%, var(--line));   background: var(--up-bg); }
  .bias.down { border-color: color-mix(in srgb, var(--down) 30%, var(--line)); background: var(--down-bg); }
  .bias.flat { border-color: color-mix(in srgb, var(--amber) 30%, var(--line)); background: var(--amber-bg); }
  .bias-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .bias-verdict { font-size: 19px; font-weight: 700; letter-spacing: .2px; }
  .bias.up   .bias-verdict { color: var(--up); }
  .bias.down .bias-verdict { color: var(--down); }
  .bias.flat .bias-verdict { color: var(--amber); }
  .bias-counts { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .bias-why { font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--faint); font-weight: 700; margin: 12px 0 6px; }
  .bias-reasons { display: flex; flex-direction: column; gap: 5px; }
  .bias-reason { font-size: 12.5px; line-height: 1.4; display: flex; gap: 8px; align-items: baseline; }
  .bias-reason .bdot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .bias-reason.up .bdot   { background: var(--up); }
  .bias-reason.down .bdot { background: var(--down); }
  .bias-reason.flat .bdot { background: var(--amber); }
  .bias-note { font-size: 11px; color: var(--muted); margin-top: 10px; font-style: italic; }
  .ai-trend { border-left: 3px solid var(--accent); }
  .ai-trend .ai-summary { font-size: 12.5px; color: var(--text); font-style: normal; line-height: 1.5; }
  .ai-block { margin-top: 14px; }
  .ai-block-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--faint); font-weight: 700;
  }
  .ai-block-body { font-size: 12.5px; color: var(--text); line-height: 1.5; margin-top: 5px; }
  .ai-scenarios {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;
    margin-top: 16px;
  }
  .ai-scenario {
    border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface2);
  }
  .ai-scenario.up   { border-color: color-mix(in srgb, var(--up) 25%, var(--line)); }
  .ai-scenario.down { border-color: color-mix(in srgb, var(--down) 25%, var(--line)); }
  .ai-scenario-label { font-size: 10.5px; font-weight: 700; }
  .ai-scenario.up .ai-scenario-label   { color: var(--up); }
  .ai-scenario.down .ai-scenario-label { color: var(--down); }
  .ai-scenario.flat .ai-scenario-label { color: var(--amber); }
  .ai-watchlist { margin: 6px 0 0 18px; padding: 0; font-size: 12.5px; color: var(--text); line-height: 1.6; }

  .card.list { grid-column: span 2; min-height: 200px; }
  .listitems { overflow-y: auto; max-height: 260px; display: flex; flex-direction: column; gap: 10px; }
  .item { font-size: 13px; line-height: 1.45; color: var(--text); }
  .item .src { color: var(--accent); font-size: 11px; margin-right: 6px; }
  .item .when { color: var(--muted); font-size: 11px; margin-left: 6px; }
  .item a { color: var(--text); text-decoration: none; }
  .item a:hover { text-decoration: underline; }

  footer { text-align: center; color: var(--faint); font-size: 11px; padding: 20px; }

  .hidden { display: none !important; }
  @media (max-width: 700px) {
    .hbar { padding: 12px 16px; }
    .tabs { padding: 0 16px; top: 88px; }
    main { padding: 16px; }
    .grid, .grid.raw { grid-template-columns: 1fr; }
    .tape .tt { padding: 6px 12px; }
  }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">
      <h1>Pre-Market Dashboard</h1>
      <span class="sub">NIFTY · GIFT · Global cues</span>
    </div>
    <div class="hmeta">
      <span class="pill" id="marketPill">…</span>
      <span id="lastUpdated">—</span>
      <span id="buildTag" class="buildtag" title="git commit this server is running">—</span>
      <span class="meta-sep"></span>
      <span id="countdown"></span>
      <label class="switch" id="liveSwitch">
        <span class="live-dot"></span>
        <span class="swlabel">Live</span>
        <input type="checkbox" id="liveToggle">
        <span class="swtrack"><span class="swthumb"></span></span>
      </label>
      <button class="refresh" id="refreshBtn">Refresh</button>
      <button class="icon" id="themeBtn" title="Toggle light / dark">☾</button>
    </div>
  </div>
  <div class="tape" id="tape"></div>
</header>

<div class="tabs">
  <div class="tab active" data-panel="analysis">Analysis <span class="tcount" id="tabCountA">9</span></div>
  <div class="tab" data-panel="raw">Raw Data <span class="tcount" id="tabCountR">12</span></div>
  <div class="tab" data-panel="news">News <span class="tcount" id="tabCountN">0</span></div>
  <div class="tab" data-panel="trend">Trend <span class="tcount" id="tabCountT">–</span></div>
  <div class="tab" data-panel="optionchain">Option Chain <span class="tcount" id="tabCountO">–</span></div>
</div>

<main>
  <div class="errbanner" id="errBanner" style="display:none"></div>
  <div id="warnBanner" class="warnbanner" style="display:none"></div>
  <div id="marketBanner" class="banner" style="display:none"></div>

  <div id="panel-analysis">
    <div id="bias"></div>
    <div id="aiTrend"></div>
    <div id="niftyLevels"></div>
    <div class="summary" id="summary"></div>
    <div class="grid checks" id="checks"></div>
  </div>

  <div id="panel-raw" class="hidden">
    <div class="section"><h2>India</h2><div class="grid raw" id="india"></div></div>
    <div class="section"><h2>Global Indices</h2><div class="grid raw" id="global"></div></div>
    <div class="section"><h2>Commodities &amp; FX</h2><div class="grid raw" id="fx"></div></div>
  </div>

  <div id="panel-news" class="hidden">
    <div id="newsSentiment"></div>
    <div id="newsList"></div>
  </div>

  <div id="panel-trend" class="hidden">
    <div id="trendStatusPanel"></div>
    <div class="chart-toolbar">
      <button class="tf-btn active" data-tf="15m">15M</button>
      <button class="tf-btn" data-tf="1h">1H</button>
    </div>
    <canvas id="trendChart"></canvas>
  </div>

  <div id="panel-optionchain" class="hidden">
    <div id="ocHeader"></div>
    <div id="ocTable"></div>
    <div id="ocStrikeSummary"></div>
    <div id="ocLevels"></div>
    <div id="ocSummary"></div>
  </div>
</main>
<footer>Free data sources: Finnhub · Twelve Data · Alpha Vantage · NSE · Yahoo Finance · TradingView · Angel One. For reference only — not investment advice.</footer>

<script>
const GROUPS = {
  gift: "india", vix: "india", nifty_ohlc: "india", nifty_trend: "india",
  sp500: "global", nasdaq: "global", dow: "global",
  nikkei: "global", hangseng: "global", shanghai: "global",
  usdinr: "fx", brent: "fx",
};
const TAPE_ORDER = ["nifty_live", "gift", "vix", "usdinr", "sp500", "brent"];
const SYMBOL = {
  nifty_live: "NIFTY", nifty_ohlc: "NIFTY YDAY", gift: "GIFT", vix: "VIX", usdinr: "USDINR",
  sp500: "S&P", nasdaq: "NASDAQ", dow: "DOW", nikkei: "NIKKEI",
  hangseng: "HANG SENG", shanghai: "SHANGHAI", brent: "BRENT",
};

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function chgClass(v) {
  if (v == null) return "flat";
  return v > 0.0001 ? "up" : (v < -0.0001 ? "down" : "flat");
}
function arrow(v) {
  if (v == null) return "";
  return v > 0.0001 ? "▲" : (v < -0.0001 ? "▼" : "");
}

/* --- theme (light / dark, remembered) --- */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("pm_theme", t);
  themeBtn.textContent = t === "dark" ? "☀" : "☾";
  themeBtn.title = t === "dark" ? "Switch to light" : "Switch to dark";
}
let theme = localStorage.getItem("pm_theme") ||
            (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
applyTheme(theme);
themeBtn.addEventListener("click", () => applyTheme(theme === "dark" ? "light" : "dark"));

/* --- pause / live toggle (remembered) --- */
const liveToggle = document.getElementById("liveToggle");
const liveSwitch = document.getElementById("liveSwitch");
let live = localStorage.getItem("pm_live") === "1";
let _auto = null;
let _cd = null;

function setLive(on) {
  live = on;
  localStorage.setItem("pm_live", on ? "1" : "0");
  liveSwitch.classList.toggle("on", on);
  liveToggle.checked = on;
  clearInterval(_auto);
  clearInterval(_cd);
  const cd = document.getElementById("countdown");
  if (on) {
    _auto = setInterval(load, 2000);
    cd.style.color = "";
  } else {
    cd.style.color = "";
  }
}
liveToggle.addEventListener("change", () => setLive(liveToggle.checked));

function tickCountdown(seconds) {
  clearInterval(_cd);
  let left = seconds;
  const cd = document.getElementById("countdown");
  if (!live) { cd.textContent = "auto-refresh off"; return; }
  cd.textContent = "refresh in " + left + "s";
  _cd = setInterval(() => {
    left -= 1;
    cd.textContent = "refresh in " + Math.max(left, 0) + "s";
  }, 1000);
}

/* --- rendering --- */
function renderTape(cards) {
  const byId = {};
  cards.forEach(c => byId[c.id] = c);
  const items = TAPE_ORDER.map(id => byId[id]).filter(Boolean);
  if (!items.length) return;
  document.getElementById("tape").innerHTML = items.map(c => `
    <div class="tt">
      <span class="ts">${esc(SYMBOL[c.id] || c.title.split(" ")[0])}</span>
      <span class="tv">${esc(c.value)}</span>
      <span class="tc ${chgClass(c.change)}">${arrow(c.change)}${esc((c.change_text || "").replace(/^\S+\s?/, ""))}</span>
    </div>`).join("");
}

function cardHTML(c) {
  const extraCls = c.id === "nifty_trend" ? (" trend " + (c.value || "").toLowerCase()) : "";
  return `
  <div class="card">
    <div class="ctop">
      <span class="ctitle">${esc(c.title)}</span>
      <span class="csrc">${esc(c.source)}</span>
    </div>
    <div class="cval small${extraCls}">${esc(c.value)}</div>
    <div class="cchg ${chgClass(c.change)}">${arrow(c.change)} ${esc(c.change_text)}</div>
    <div class="cdetail">${esc(c.detail)}</div>
    <div class="cupdated">${esc(c.updated)}</div>
  </div>`;
}

function fmtPrice(n) {
  return Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
}

function niftyLadderHTML(c, title) {
  const o = c.extra.ohlc;
  const current = c.extra.current;
  const span = o.high - o.low;
  const pct = span > 0 ? Math.min(100, Math.max(0, ((o.close - o.low) / span) * 100)) : 50;
  const resGap = o.high - o.close, supGap = o.close - o.low;
  const curPct = (current != null && span > 0)
    ? Math.min(106, Math.max(-6, ((current - o.low) / span) * 100)) : null;
  const supDist = current != null ? current - o.low : null;
  const resDist = current != null ? current - o.high : null;
  return `
  <div class="card wide-ladder-card">
    <div class="ctop">
      <span class="ctitle">${esc(title)}</span>
      <span class="csrc">${esc(c.source)}</span>
    </div>
    <div class="hladder">
      <div class="hladder-track">
        <div class="hladder-marker sup" style="left:0%"><span class="hm-dot"></span></div>
        <div class="hladder-marker cls" style="left:${pct}%"><span class="hm-dot"></span></div>
        <div class="hladder-marker res" style="left:100%"><span class="hm-dot"></span></div>
        ${curPct != null ? `<div class="hladder-marker cur" style="left:${curPct}%"><span class="hm-dot"></span></div>` : ""}
      </div>
      <div class="hladder-labels">
        <div class="hl-item sup">
          <span class="hl-label">Support</span>
          <span class="hl-val">${fmtPrice(o.low)}</span>
        </div>
        <div class="hl-item cls">
          <span class="hl-label">Prev Close · ${esc(o.date || "")}</span>
          <span class="hl-val">${fmtPrice(o.close)}</span>
          <span class="hl-sub">▲ ${fmtPrice(supGap)} · ▼ ${fmtPrice(resGap)} pts</span>
        </div>
        <div class="hl-item res">
          <span class="hl-label">Resistance</span>
          <span class="hl-val">${fmtPrice(o.high)}</span>
        </div>
      </div>
    </div>
    ${current != null ? `
    <div class="hladder-current">
      <span class="hc-label">Current (GIFT)</span>
      <span class="hc-val">${fmtPrice(current)}</span>
      <span class="hc-dist ${supDist >= 0 ? "up" : "down"}">${supDist >= 0
        ? `▲ ${fmtPrice(supDist)} pts above Support`
        : `▼ ${fmtPrice(Math.abs(supDist))} pts BELOW Support — broken down`}</span>
      <span class="hc-dist ${resDist >= 0 ? "breakout" : "muted"}">${resDist >= 0
        ? `▲ ${fmtPrice(resDist)} pts ABOVE Resistance — broken out`
        : `${fmtPrice(Math.abs(resDist))} pts below Resistance (headroom left)`}</span>
    </div>` : ""}
    ${c.rule ? `<div class="crule">${esc(c.rule)}</div>` : ""}
  </div>`;
}

function checkCardHTML(c) {
  const title = c.title.replace(/^\d+\s*[·.]\s*/, "");
  return `
  <div class="card check">
    <div class="ctop">
      <span class="ctitle">${esc(title)}</span>
      <span class="csrc">${esc(c.source)}</span>
    </div>
    <div class="cverdict ${c.verdict_class}"><span class="vdot"></span>${esc(c.verdict)}</div>
    <div class="cvalue">${esc(c.value)}</div>
    ${c.reason ? `<div class="ceq">${esc(c.reason)}</div>` : ""}
    ${c.rule ? `<div class="crule">${esc(c.rule)}</div>` : ""}
  </div>`;
}

function renderBanner(mkt) {
  const b = document.getElementById("marketBanner");
  if (!mkt) { b.style.display = "none"; return; }
  const s = mkt.state;
  b.className = "banner " + (s === "open" ? "open" : s === "pre-market" ? "premarket" : "closed");
  b.innerHTML = "";
  const dot = document.createElement("span"); dot.className = "dot";
  b.appendChild(dot);
  const txt = document.createElement("span");
  if (s === "open") txt.textContent = "NSE market is OPEN — trading live (09:15–15:30 IST).";
  else if (s === "pre-market") txt.textContent = "NSE is in PRE-MARKET — opens at " + mkt.next_open + " IST. These readings set today's opening tone.";
  else txt.textContent = "NSE market is CLOSED — next open " + mkt.next_open + " IST. Cards show the last available quotes.";
  b.appendChild(txt);
  if (mkt.state_hint) {
    const sub = document.createElement("span"); sub.className = "bsub";
    sub.textContent = "· " + mkt.state_hint;
    b.appendChild(sub);
  }
  b.style.display = "flex";
}

function renderSummary(checks) {
  const signals = checks;
  const good = signals.filter(c => c.verdict_class === "up").length;
  const bad = signals.filter(c => c.verdict_class === "down").length;
  const mid = signals.filter(c => c.verdict_class === "flat").length;
  document.getElementById("summary").innerHTML =
    `<span class="schip good">▲ ${good} positive</span>
     <span class="schip mid">◆ ${mid} neutral</span>
     <span class="schip bad">▼ ${bad} caution</span>`;

  let label, cls;
  if (bad > good && bad >= 3) { label = "CAUTIOUS / BEARISH"; cls = "down"; }
  else if (good > bad && good >= 3) { label = "CONSTRUCTIVE / BULLISH"; cls = "up"; }
  else { label = "MIXED / NEUTRAL"; cls = "flat"; }

const RANK = { down: 0, up: 1, flat: 2 };
  const reasons = signals
    .filter(c => c.id !== "chk_nifty")  // support/resistance isn't a directional signal — shown as its own ladder card instead
    .slice()
    .sort((a, b) => RANK[a.verdict_class] - RANK[b.verdict_class])
    .map(c => `<div class="bias-reason ${c.verdict_class}"><span class="bdot"></span>
      ${esc(c.title.replace(/^\d+\s*·\s*/, ""))}: ${esc(c.verdict)}</div>`).join("");

  document.getElementById("bias").innerHTML = `
    <div class="bias ${cls}">
      <div class="bias-head">
        <span class="bias-verdict">PRE-MARKET BIAS: ${label}</span>
        <span class="bias-counts">${good} bullish · ${mid} neutral · ${bad} bearish</span>
      </div>
      <div class="bias-why">Driving the verdict</div>
      <div class="bias-reasons">${reasons || '<div class="bias-reason flat"><span class="bdot"></span>No strong signals either way</div>'}</div>
      <div class="bias-note">Rule-based pre-market checks, not a prediction of the whole trading day.</div>
    </div>`;
}

function newsAsCheck(newsData) {
  const s = (newsData && newsData.sentiment) || null;
  if (!s || !s.relevant_count) return null;
  return {
    id: "chk_news", title: "8 · News Sentiment", source: newsData.method === "AI" ? "AI (DeepSeek Flash)" : "Keyword rules",
    verdict: s.overall, verdict_class: s.class,
    value: `${s.positive}▲ ${s.neutral}◆ ${s.negative}▼ of ${s.relevant_count} relevant`,
    reason: `${s.high_impact_count} high-impact of ${s.relevant_count} relevant (${s.total_count} scanned)`,
    rule: "Only medium/high-impact headlines count · net negative+high-impact → Negative · net positive+high-impact → Positive · else Slightly ±/Mixed",
  };
}

async function load() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  try {
    const [res, newsRes] = await Promise.all([
      fetch("/api/market", { cache: "no-store" }),
      fetch("/api/news", { cache: "no-store" }).catch(() => null),
    ]);
    const d = await res.json();
    const newsData = newsRes ? await newsRes.json().catch(() => null) : null;
    document.getElementById("errBanner").style.display = "none";
    const pill = document.getElementById("marketPill");
    pill.textContent = d.market.open ? "NSE OPEN" : "NSE " + (d.market.state || "").toUpperCase();
    pill.className = "pill " + (d.market.open ? "open" : "closed");
    document.getElementById("lastUpdated").textContent = "updated " + d.generated_at + " IST";
    document.getElementById("buildTag").textContent =
      "build " + (d.build || "?") + (d.build_started ? " · up since " + d.build_started : "");
    renderBanner(d.market);

    const warnBanner = document.getElementById("warnBanner");
    const warnings = d.warnings || [];
    if (warnings.length) {
      warnBanner.innerHTML = "⚠ " + warnings.map(w => `<span class="wline">${esc(w)}</span>`).join("");
      warnBanner.style.display = "block";
    } else {
      warnBanner.style.display = "none";
    }

    const newsCheck = newsAsCheck(newsData);
    const checks = (d.checks || []).concat(newsCheck ? [newsCheck] : []);
    const niftyCheck = checks.find(c => c.id === "chk_nifty" && c.extra && c.extra.ohlc);
    document.getElementById("niftyLevels").innerHTML = niftyCheck
      ? niftyLadderHTML(niftyCheck, niftyCheck.title.replace(/^\d+\s*[·.]\s*/, ""))
      : "";
    const gridChecks = checks.filter(c => c.id !== "chk_nifty");
    document.getElementById("checks").innerHTML = gridChecks.map(checkCardHTML).join("");
    document.getElementById("tabCountA").textContent = checks.length;
    renderSummary(checks);

    document.getElementById("aiTrend").innerHTML = newsData ? aiTrendHTML(newsData.trend) : "";

    if (newsData) {
      newsLoaded = true;
      document.getElementById("tabCountN").textContent = (newsData.items || []).length;
      document.getElementById("newsSentiment").innerHTML =
        newsSentimentHTML(newsData.sentiment || {}, newsData.method, newsData.generated_at, newsData.total_fetched);
      const items = newsData.items || [];
      document.getElementById("newsList").innerHTML = items.length
        ? `<div class="grid news-grid">${items.map(newsItemHTML).join("")}</div>`
        : `<div class="errbanner" style="background:var(--surface);color:var(--muted)">No headlines available right now.</div>`;
    }

    const cards = d.cards || [];
    document.getElementById("tabCountR").textContent = cards.length;
    renderTape(cards);
    ["india", "global", "fx"].forEach(g => document.getElementById(g).innerHTML = "");
    for (const c of cards) {
      const g = GROUPS[c.id] || "india";
      document.getElementById(g).innerHTML += cardHTML(c);
    }

    tickCountdown(live ? 2 : (d.refresh_seconds || 10));
  } catch (e) {
    const b = document.getElementById("errBanner");
    b.style.display = "block";
    b.textContent = "Could not reach the dashboard API — is app.py running? (" + e.message + ")";
  } finally {
    btn.disabled = false;
  }
}

let newsLoaded = false;

function newsSentimentHTML(s, method, generatedAt, totalFetched) {
  const cls = s.class || "flat";
  const relevant = s.relevant_count != null ? s.relevant_count : (s.positive + s.neutral + s.negative);
  const total = s.total_count != null ? s.total_count : totalFetched;
  return `
  <div class="bias ${cls}">
    <div class="bias-head">
      <span class="bias-verdict">NEWS SENTIMENT: ${esc((s.overall || "Unavailable").toUpperCase())}</span>
      <span class="bias-counts">${s.positive} positive · ${s.neutral} neutral · ${s.negative} negative
        · ${s.high_impact_count} high-impact</span>
    </div>
    <div class="bias-note">${relevant} of ${total} headlines were relevant to NIFTY — the rest filtered out as noise ·
      ${method === "AI" ? "classified by a cheap LLM pass" : "classified by keyword rules"}
      · updated ${esc(generatedAt || "")} IST · headlines link to the original source</div>
  </div>`;
}

function aiTrendHTML(trend) {
  if (!trend) return "";
  const cls = trend.expected_trend === "bullish" ? "up"
    : trend.expected_trend === "bearish" ? "down" : "flat";
  const why = (trend.why || []).map(w => `<div class="bias-reason ${cls}"><span class="bdot"></span>${esc(w)}</div>`).join("");
  const watch = (trend.watch_after_open || []).map((w, i) => `<li>${esc(w)}</li>`).join("");
  return `
  <div class="bias ai-trend ${cls}">
    <div class="bias-head">
      <span class="bias-verdict">🤖 AI HYPOTHESIS: ${esc((trend.expected_trend || "").toUpperCase())}</span>
      <span class="bias-counts">confidence: ${esc(trend.confidence || "—")}</span>
    </div>

    ${why ? `<div class="bias-why">Why</div><div class="bias-reasons">${why}</div>` : ""}

    ${trend.expected_opening ? `<div class="ai-block"><span class="ai-block-label">Expected opening</span>
      <div class="ai-block-body">${esc(trend.expected_opening)}</div></div>` : ""}

    <div class="ai-scenarios">
      <div class="ai-scenario up"><span class="ai-scenario-label">▲ Bullish scenario</span>
        <div class="ai-block-body">${esc(trend.bullish_scenario || "")}</div></div>
      <div class="ai-scenario flat"><span class="ai-scenario-label">◆ Neutral scenario</span>
        <div class="ai-block-body">${esc(trend.neutral_scenario || "")}</div></div>
      <div class="ai-scenario down"><span class="ai-scenario-label">▼ Bearish scenario</span>
        <div class="ai-block-body">${esc(trend.bearish_scenario || "")}</div></div>
    </div>

    ${watch ? `<div class="ai-block"><span class="ai-block-label">What to watch after 9:15</span>
      <ol class="ai-watchlist">${watch}</ol></div>` : ""}

    <div class="bias-note">${esc(trend.conclusion || "This is only a starting hypothesis — confirmation required from actual price action, do not trade purely from pre-market bias.")}
      The rule-based PRE-MARKET BIAS above remains the primary, auditable verdict.</div>
  </div>`;
}

function newsItemHTML(it) {
  const impactCls = it.impact === "high" ? "down" : (it.impact === "medium" ? "flat" : "up");
  return `
  <div class="card news-card">
    <div class="ctop">
      <span class="cverdict ${it.sentiment === "positive" ? "up" : (it.sentiment === "negative" ? "down" : "flat")}">
        <span class="vdot"></span>${esc(it.sentiment)}</span>
      <span class="news-impact ${impactCls}">${esc(it.impact)} impact</span>
    </div>
    <a class="news-headline" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(it.headline)}</a>
    ${it.reason ? `<div class="creason">${esc(it.reason)}</div>` : ""}
    <div class="ctop news-foot">
      <span class="csrc">${esc(it.source)}</span>
      <span class="cupdated">${it.ts ? new Date(it.ts * 1000).toLocaleString("en-IN") : ""}</span>
    </div>
  </div>`;
}

async function loadNews() {

/* --- Trend Analysis tab (rule-based, no AI) --- */
let trendLoaded = false;
let trendData = null;
let currentTrendTf = "15m";
let _trendPollTimer = null;

function trendStatusHTML(d) {
  if (!d || d.error) {
    return `<div class="errbanner">Could not load trend — ${esc((d && d.error) || "no data")}</div>`;
  }
  if (d.data_status === "stale") {
    return `
    <div class="bias down trend-stale">
      <div class="bias-head"><span class="bias-verdict">⚠️ DATA STALE — trend analysis paused</span></div>
      <div class="bias-note">Angel One candle data hasn't updated recently — showing the last known state below,
      not advancing further until fresh data arrives. Never trust a stale read as live.</div>
    </div>`;
  }
  const trend = d.trend_15m || "sideways";
  const cls = trend === "bullish" ? "up" : trend === "bearish" ? "down" : "flat";
  const emoji = d.reversal ? "⚠️" : trend === "bullish" ? "🟢" : trend === "bearish" ? "🔴" : "🟡";
  const label = d.reversal ? "POSSIBLE REVERSAL" : trend.toUpperCase();
  const forming = d[`forming_${currentTrendTf}`];
  const lastCandles = d[`candles_${currentTrendTf}`] || [];
  const lastClosed = lastCandles.length ? lastCandles[lastCandles.length - 1] : null;
  const fmtTime = ts => ts ? new Date(ts * 1000).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "—";
  return `
  <div class="bias trend-status ${cls}">
    <div class="bias-head">
      <span class="bias-verdict">${emoji} TREND: ${esc(label)}</span>
    </div>
    <div class="trend-grid">
      <div><span class="tg-label">15M STRUCTURE</span><span class="tg-val">${(d.structure_sequence_15m || []).join(" → ") || "—"}</span></div>
      <div><span class="tg-label">1H TREND</span><span class="tg-val">${esc((d.trend_1h || "—").toUpperCase())}</span></div>
      <div><span class="tg-label">NEAREST SUPPORT</span><span class="tg-val up">${d.nearest_support != null ? fmtPrice(d.nearest_support) : "—"}</span></div>
      <div><span class="tg-label">NEAREST RESISTANCE</span><span class="tg-val down">${d.nearest_resistance != null ? fmtPrice(d.nearest_resistance) : "—"}</span></div>
      <div><span class="tg-label">INVALIDATION LEVEL</span><span class="tg-val">${d.invalidation_level != null ? fmtPrice(d.invalidation_level) : "—"}</span></div>
    </div>
    <div class="trend-candle-status">
      Last closed candle: ${fmtTime(lastClosed && lastClosed.ts)}
      ${forming ? `· Current candle: ${fmtTime(forming.open_ts)}–${fmtTime(forming.closes_at)} <span class="forming-tag">FORMING</span>` : ""}
    </div>
    <div class="bias-note">Rule-based structure analysis — no prediction, no buy/sell signal, recalculated on every closed candle.</div>
  </div>`;
}

function drawTrendChart(canvas, data, tf) {
  if (!canvas || !data) return;
  const candles = data[`candles_${tf}`] || [];
  if (!candles.length) return;
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 900, cssH = 420;
  canvas.width = cssW * dpr; canvas.height = cssH * dpr;
  canvas.style.height = cssH + "px";
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  const style = getComputedStyle(document.documentElement);
  const col = name => style.getPropertyValue(name).trim();
  const upCol = col("--up"), downCol = col("--down"), accentCol = col("--accent"), amberCol = col("--amber"), textCol = col("--text");

  const shown = candles.slice(-120);
  const lo = Math.min(...shown.map(c => c.low));
  const hi = Math.max(...shown.map(c => c.high));
  const pad = (hi - lo) * 0.08 || 1;
  const yMin = lo - pad, yMax = hi + pad;
  const marginL = 60, marginR = 10, marginT = 10, marginB = 10;
  const plotW = cssW - marginL - marginR, plotH = cssH - marginT - marginB;
  const x = i => marginL + (i / Math.max(1, shown.length - 1)) * plotW;
  const y = p => marginT + plotH - ((p - yMin) / (yMax - yMin)) * plotH;
  const candleW = Math.max(2, plotW / shown.length * 0.6);

  const zones = data[`zones_${tf}`] || [];
  zones.forEach(z => {
    const zc = z.kind === "support" ? upCol : downCol;
    ctx.fillStyle = zc; ctx.globalAlpha = Math.min(0.22, 0.06 + z.strength / 40);
    ctx.fillRect(marginL, y(z.hi), plotW, Math.max(1, y(z.lo) - y(z.hi)));
    ctx.globalAlpha = 1;
  });

  shown.forEach((c, i) => {
    const cx = x(i);
    const up = c.close >= c.open;
    ctx.strokeStyle = ctx.fillStyle = up ? upCol : downCol;
    ctx.beginPath(); ctx.moveTo(cx, y(c.high)); ctx.lineTo(cx, y(c.low)); ctx.stroke();
    const bodyTop = y(Math.max(c.open, c.close)), bodyBot = y(Math.min(c.open, c.close));
    ctx.fillRect(cx - candleW / 2, bodyTop, candleW, Math.max(1, bodyBot - bodyTop));
  });

  const firstShownI = candles.length - shown.length;
  const swings = (data[`swings_${tf}`] || []).filter(s => s.i >= firstShownI);
  ctx.font = "10px " + col("--mono");
  swings.forEach(s => {
    const i = s.i - firstShownI;
    const cx = x(i), cy = y(s.price);
    ctx.fillStyle = accentCol;
    ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();
  });

  // y-axis price labels
  ctx.fillStyle = textCol; ctx.font = "10px " + col("--mono"); ctx.textAlign = "right";
  for (let k = 0; k <= 4; k++) {
    const p = yMin + (yMax - yMin) * (k / 4);
    ctx.fillText(fmtPrice(p), marginL - 6, y(p) + 3);
  }
  ctx.textAlign = "left";
}

function startTrendPolling() {
  stopTrendPolling();
  _trendPollTimer = setInterval(loadTrend, 45000);
}
function stopTrendPolling() {
  if (_trendPollTimer) clearInterval(_trendPollTimer);
  _trendPollTimer = null;
}

async function loadTrend() {
  try {
    const res = await fetch("/api/trend", { cache: "no-store" });
    const d = await res.json();
    trendLoaded = true;
    trendData = d;
    document.getElementById("tabCountT").textContent =
      (d.breakouts_15m || []).length + (d.breakdowns_15m || []).length;
    document.getElementById("trendStatusPanel").innerHTML = trendStatusHTML(d);
    drawTrendChart(document.getElementById("trendChart"), d, currentTrendTf);
  } catch (e) {
    document.getElementById("trendStatusPanel").innerHTML =
      `<div class="errbanner">Could not load trend — ${esc(e.message)}</div>`;
  }
}

document.querySelectorAll(".tf-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentTrendTf = btn.dataset.tf;
    if (trendData) {
      document.getElementById("trendStatusPanel").innerHTML = trendStatusHTML(trendData);
      drawTrendChart(document.getElementById("trendChart"), trendData, currentTrendTf);
    }
  });
});

/* --- Option Chain tab (positioning read only — no trade signals) --- */
let ocLoaded = false;
let _ocPollTimer = null;

function startOcPolling() { stopOcPolling(); _ocPollTimer = setInterval(loadOptionChain, 45000); }
function stopOcPolling() { if (_ocPollTimer) clearInterval(_ocPollTimer); _ocPollTimer = null; }

function ocHeaderHTML(d) {
  if (d.error || d.spot == null) {
    return `<div class="errbanner">Could not load option chain — ${esc(d.error || "no data")}</div>`;
  }
  return `
  <div class="oc-header">
    <div class="oc-hitem"><span class="tg-label">NIFTY</span><span class="tg-val">${fmtPrice(d.spot)}</span></div>
    <div class="oc-hitem"><span class="tg-label">EXPIRY</span><span class="tg-val">${esc(d.expiry)}</span></div>
    <div class="oc-hitem"><span class="tg-label">DTE</span><span class="tg-val">${d.dte != null ? d.dte + (d.dte === 1 ? " day" : " days") : "—"}</span></div>
    <div class="oc-hitem"><span class="tg-label">ATM</span><span class="tg-val">${fmtPrice(d.atm)}</span></div>
    <div class="oc-hitem"><span class="tg-label">PCR</span><span class="tg-val">${d.pcr != null ? d.pcr : "—"}</span></div>
    <div class="oc-hitem"><span class="tg-label">MAX PAIN</span><span class="tg-val">${d.max_pain != null ? fmtPrice(d.max_pain) : "—"}</span></div>
  </div>`;
}

function ocCell(side) {
  if (!side) return `<td colspan="5" class="oc-empty">—</td>`;
  const chgCls = side.oi_chg > 0 ? "up" : side.oi_chg < 0 ? "down" : "flat";
  return `
    <td class="oc-num">${side.oi != null ? side.oi.toLocaleString("en-IN") : "—"}</td>
    <td class="oc-num ${chgCls}">${side.oi_chg != null ? (side.oi_chg > 0 ? "+" : "") + side.oi_chg.toLocaleString("en-IN") : "—"}</td>
    <td class="oc-num">${side.volume != null ? side.volume.toLocaleString("en-IN") : "—"}</td>
    <td class="oc-num">${side.iv != null ? side.iv.toFixed(1) + "%" : "—"}</td>
    <td class="oc-num oc-ltp">${side.ltp != null ? fmtPrice(side.ltp) : "—"}</td>`;
}

function ocTableHTML(d) {
  if (!d.rows || !d.rows.length) return "";
  const rows = d.rows.map(r => {
    const isAtm = r.strike === d.atm;
    return `<tr class="${isAtm ? "oc-atm" : ""}">
      ${ocCell(r.ce)}
      <td class="oc-strike">${fmtPrice(r.strike)}</td>
      ${ocCell(r.pe)}
    </tr>`;
  }).join("");
  return `
  <div class="oc-table-wrap">
  <table class="oc-table">
    <thead>
      <tr>
        <th colspan="5" class="oc-side-label ce">CALLS</th>
        <th></th>
        <th colspan="5" class="oc-side-label pe">PUTS</th>
      </tr>
      <tr>
        <th>OI</th><th>OI Chg</th><th>Vol</th><th>IV</th><th>LTP</th>
        <th>Strike</th>
        <th>LTP</th><th>IV</th><th>Vol</th><th>OI Chg</th><th>OI</th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>
  </div>`;
}

function ocStrikeSummaryHTML(d) {
  const s = d.strikes_info || {};
  const call = s.call || {}, put = s.put || {};
  const line = (label, v) => `<div class="oc-sum-line"><span class="tg-label">${label}</span><span class="tg-val">${v != null ? fmtPrice(v) : "—"}</span></div>`;
  return `
  <div class="oc-strike-summary">
    <div class="oc-side-block ce">
      <div class="oc-side-title">CALL SIDE</div>
      ${line("Highest OI", call.highest_oi)}
      ${line("Largest OI Add", call.largest_add)}
      ${line("Largest Unwind", call.largest_unwind)}
    </div>
    <div class="oc-side-block pe">
      <div class="oc-side-title">PUT SIDE</div>
      ${line("Highest OI", put.highest_oi)}
      ${line("Largest OI Add", put.largest_add)}
      ${line("Largest Unwind", put.largest_unwind)}
    </div>
  </div>`;
}

function ocLevelsHTML(d) {
  const levels = d.levels || { resistance: [], support: [] };
  const maxOi = Math.max(1, ...[...levels.resistance, ...levels.support].map(z => z.oi));
  const bar = (z, cls) => `<div class="oc-level-row">
    <span class="oc-level-strike">${fmtPrice(z.strike)}</span>
    <div class="oc-level-bar-track"><div class="oc-level-bar ${cls}" style="width:${Math.max(6, z.oi / maxOi * 100)}%"></div></div>
    <span class="oc-level-oi">${z.oi.toLocaleString("en-IN")}</span>
  </div>`;
  return `
  <div class="oc-levels">
    <div class="oc-levels-title">OPTION CHAIN LEVELS</div>
    <div class="oc-level-group"><span class="oc-level-label down">Resistance (Call OI)</span>${levels.resistance.map(z => bar(z, "down")).join("")}</div>
    <div class="oc-level-group"><span class="oc-level-label up">Support (Put OI)</span>${levels.support.map(z => bar(z, "up")).join("")}</div>
    <div class="bias-note">Positioning concentration from open interest — separate from the Trend tab's price-based support/resistance.</div>
  </div>`;
}

function ocSummaryHTML(d) {
  const s = d.summary || {};
  const cls = s.pcr_read === "Bullish-leaning" ? "up" : s.pcr_read === "Bearish-leaning" ? "down" : "flat";
  return `
  <div class="bias ${cls}">
    <div class="bias-head"><span class="bias-verdict">OPTION CHAIN READ: ${esc((s.pcr_read || "Unknown").toUpperCase())}</span></div>
    <div class="trend-grid">
      <div><span class="tg-label">PCR</span><span class="tg-val">${s.pcr != null ? s.pcr : "—"}</span></div>
      <div><span class="tg-label">RESISTANCE</span><span class="tg-val">${(s.resistance_zone || []).map(fmtPrice).join(" · ") || "—"}</span></div>
      <div><span class="tg-label">SUPPORT</span><span class="tg-val">${(s.support_zone || []).map(fmtPrice).join(" · ") || "—"}</span></div>
      <div><span class="tg-label">LARGEST CALL ADD</span><span class="tg-val">${s.largest_call_add != null ? fmtPrice(s.largest_call_add) : "—"}</span></div>
      <div><span class="tg-label">LARGEST PUT ADD</span><span class="tg-val">${s.largest_put_add != null ? fmtPrice(s.largest_put_add) : "—"}</span></div>
    </div>
    <div class="bias-note">⚠️ ${esc(s.note || "Option-chain data alone is not a trade signal.")}</div>
  </div>`;
}

async function loadOptionChain() {
  try {
    const res = await fetch("/api/optionchain", { cache: "no-store" });
    const d = await res.json();
    ocLoaded = true;
    document.getElementById("tabCountO").textContent = d.atm != null ? "•" : "–";
    document.getElementById("ocHeader").innerHTML = ocHeaderHTML(d);
    document.getElementById("ocTable").innerHTML = ocTableHTML(d);
    document.getElementById("ocStrikeSummary").innerHTML = ocStrikeSummaryHTML(d);
    document.getElementById("ocLevels").innerHTML = ocLevelsHTML(d);
    document.getElementById("ocSummary").innerHTML = ocSummaryHTML(d);
  } catch (e) {
    document.getElementById("ocHeader").innerHTML = `<div class="errbanner">Could not load option chain — ${esc(e.message)}</div>`;
  }
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    const panel = t.dataset.panel;
    document.getElementById("panel-analysis").classList.toggle("hidden", panel !== "analysis");
    document.getElementById("panel-raw").classList.toggle("hidden", panel !== "raw");
    document.getElementById("panel-news").classList.toggle("hidden", panel !== "news");
    document.getElementById("panel-trend").classList.toggle("hidden", panel !== "trend");
    document.getElementById("panel-optionchain").classList.toggle("hidden", panel !== "optionchain");
    if (panel === "news" && !newsLoaded) loadNews();
    if (panel === "trend") {
      if (!trendLoaded) loadTrend();
      startTrendPolling();
    } else {
      stopTrendPolling();
    }
    if (panel === "optionchain") {
      if (!ocLoaded) loadOptionChain();
      startOcPolling();
    } else {
      stopOcPolling();
    }
  });
});

document.getElementById("refreshBtn").addEventListener("click", load);
setLive(live);
load();
